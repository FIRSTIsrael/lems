"""
A scheduled practice table assignment for a team
"""
type PracticeTableAssignment {
  "Unique identifier for the assignment"
  id: String!

  "Division ID"
  divisionId: String!

  "Team assigned to this slot"
  team: Team!

  "Table number (1-based)"
  tableNumber: Int!

  "Start time of the practice slot"
  startTime: String!

  "End time of the practice slot"
  endTime: String!

  "When this assignment was created"
  createdAt: String!
}

"""
Input for creating a practice table assignment
"""
input CreatePracticeTableAssignmentInput {
  "Division ID"
  divisionId: String!

  "Team ID"
  teamId: String!

  "Table number"
  tableNumber: Int!

  "Start time (ISO 8601 datetime string)"
  startTime: String!

  "End time (ISO 8601 datetime string)"
  endTime: String!
}

extend type Query {
  "Get all practice table assignments for a division"
  practiceTableAssignments(divisionId: String!): [PracticeTableAssignment!]!

  "Get practice table assignments for a specific team"
  teamPracticeTableAssignments(teamId: String!): [PracticeTableAssignment!]!
}

extend type Mutation {
  "Create a new practice table assignment"
  createPracticeTableAssignment(
    input: CreatePracticeTableAssignmentInput!
  ): PracticeTableAssignment!

  "Delete a practice table assignment"
  deletePracticeTableAssignment(assignmentId: String!): Boolean!

  "Clear all practice table assignments for a division"
  clearPracticeTableAssignments(divisionId: String!): Boolean!
}

extend type Subscription {
  "Subscribe to practice table assignment changes for a division"
  practiceTableAssignmentsUpdated(divisionId: String!): [PracticeTableAssignment!]!
}
