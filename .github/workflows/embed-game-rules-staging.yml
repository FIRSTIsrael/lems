name: Embed Game Rules Corpus (Staging)

on:
  workflow_dispatch:

permissions: {}

jobs:
  embed:
    name: Embed Game Rules Corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build embedding job
        run: npx nx build-embed-game-rules backend

      - name: Run embedding job
        env:
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          PG_SSL_CA: ${{ secrets.PG_SSL_CA }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🔄 Embedding game-rules corpus into Postgres (pgvector)..."
          node dist/apps/backend-embed-game-rules/main.js
          echo "✅ Embedding completed successfully"
